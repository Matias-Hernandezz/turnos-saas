name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Pytest
        env:
          JWT_SECRET: test-jwt-secret-key-32chars-min
          DATABASE_URL: sqlite://
          APP_ENV: test
        run: pytest -q
